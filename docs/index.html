<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NotiMed</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>NotiMed</h1>

  <section id="login-view">
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="login-btn" class="primary">Entrar</button>
    <p id="login-error" style="color:#b00020; font-size:13px;"></p>
  </section>

  <section id="app-view" class="hidden">
    <button id="logout">Salir</button>

    <h2>Nueva cita</h2>
    <div class="card">
      <label for="cita-nombre">Nombre</label>
      <input id="cita-nombre" placeholder="Ej. Cita hematología" />
      <label for="cita-fecha">Fecha</label>
      <input id="cita-fecha" type="date" />
      <label for="cita-hora">Hora</label>
      <input id="cita-hora" type="time" />
      <label for="cita-lugar">Lugar</label>
      <input id="cita-lugar" placeholder="Ej. Clínica del Norte" />
      <label for="cita-descripcion">Notas (opcional)</label>
      <input id="cita-descripcion" />
      <button id="guardar-cita" class="primary">Guardar cita</button>
    </div>

    <h2>Nuevo egreso</h2>
    <div class="card">
      <label for="egreso-cita">Cita que lo generó</label>
      <select id="egreso-cita"></select>
      <label for="egreso-orden">Número de orden</label>
      <input id="egreso-orden" placeholder="Ej. 4587231" />

      <h3>Citas</h3>
      <div id="items-cita"></div>
      <button type="button" data-tipo="cita" class="agregar-item">+ Agregar cita</button>

      <h3>Exámenes de laboratorio</h3>
      <div id="items-examen"></div>
      <button type="button" data-tipo="examen" class="agregar-item">+ Agregar examen</button>

      <h3>Medicinas a reclamar</h3>
      <div id="items-medicina"></div>
      <button type="button" data-tipo="medicina" class="agregar-item">+ Agregar medicina</button>

      <button id="guardar-egreso" class="primary">Guardar egreso</button>
    </div>

    <h2>Próximas citas</h2>
    <ul id="lista-citas"></ul>

    <h2>Egresos pendientes de autorizar</h2>
    <ul id="lista-egresos"></ul>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
